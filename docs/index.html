<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATMlib Sprite Editor</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css?family=Cookie&display=swap" rel="stylesheet" />
<style>:root{--bg:#fefefd;--panel:#f5f5f3;--ink:#333;--muted:#6b5f5e;--accent:#4a3b3a;--warn:#c0392b;--yellow:#f4d35e;--line:#ddd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 14px;background:#fefefd;border-bottom:3px solid #4a3b3a;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.site-logo{display:flex;align-items:center;flex-shrink:0}.site-logo img{height:44px;width:auto;display:block}
header h1{font-size:16px;margin:0;color:#4a3b3a;letter-spacing:.04em}
.bmc-slot{margin-left:auto;display:flex;align-items:center}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
button,select,input[type=number],input[type=text]{background:#4a3b3a;color:#fefefd;border:1px solid #4a3b3a;padding:3px 8px;border-radius:3px;font:inherit}
button:hover{background:#2e2424;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.active{background:#2e2424;box-shadow:inset 0 0 0 1px #fefefd}
button.ghost{background:#fff;color:#4a3b3a}button.ghost:hover{background:#eee}
button.ghost.active{background:#4a3b3a;color:#fefefd}
button.play{background:#f4d35e;color:#2e2424;border-color:#4a3b3a;font-weight:600;min-width:70px}
button.play:hover{background:#e8c443}
button.play.on{background:#c0392b;color:#fff}
button.sm{padding:1px 6px;font-size:12px}
input[type=number],input[type=text],select.light{background:#fff;color:#333}
input[type=number]{width:62px}
input[type=text]{min-width:0}
input[type=range]{accent-color:#4a3b3a;width:90px}
input[type=checkbox],input[type=radio]{accent-color:#4a3b3a}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;height:calc(100vh - 62px);min-height:0}
.panel{padding:10px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.panel.right{border-right:0;border-left:1px solid var(--line);background:#f7f6f4}
.panel.main{background:var(--bg);display:flex;flex-direction:column;padding:0;overflow:hidden}
.panel h2{font-size:12px;margin:12px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.panel h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:78px;color:var(--muted)}
.row label.chk{min-width:0;color:var(--ink);display:flex;align-items:center;gap:4px}
.hint{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;gap:8px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;margin:3px 0;cursor:pointer}
.item:hover{border-color:#4a3b3a}.item.sel{border-color:#4a3b3a;box-shadow:inset 3px 0 0 #f4d35e}
.item canvas{display:block;flex-shrink:0;border:1px solid #bbb;border-radius:2px;background:var(--chk)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--accent)}
.item .meta{color:var(--muted);font-size:11px;display:block;font-weight:400}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool-grid button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:4px}
.tool-grid button kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}
.swatches{display:flex;gap:8px;align-items:center;margin:6px 0}
.sw{width:38px;height:38px;border:2px solid #bbb;border-radius:4px;cursor:pointer;position:relative;padding:0;background:#fff}
.sw.b{background:#000}.sw.w{background:#fff}
.sw.t{background:var(--chk)}
.sw.p{border-color:#4a3b3a;box-shadow:0 0 0 2px #f4d35e}
.sw.s{border:2px dashed #4a3b3a}
.sw.off{opacity:.3;cursor:not-allowed}
.sw span{position:absolute;right:1px;bottom:0;font-size:9px;font-weight:700;color:#c0392b;background:#fff;border-radius:2px;padding:0 2px}
:root{--chk:repeating-conic-gradient(#d9d5cf 0% 25%,#f3f1ed 0% 50%) 0 0/10px 10px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:#faf9f7}
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:#f1efeb;flex-wrap:wrap}
.bar b{color:var(--accent)}
.stage-scroll{flex:1;overflow:auto;display:flex;padding:20px;background:#ebe8e4}
#cv{margin:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;box-shadow:0 0 0 1px #4a3b3a,0 4px 14px rgba(0,0,0,.25);touch-action:none;flex-shrink:0}
.frames{border-top:2px solid #4a3b3a;background:#faf9f7;flex:0 0 auto;display:flex;flex-direction:column}
.fr-body{display:flex;align-items:stretch;min-height:0}
.thumbs{flex:1;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;align-items:flex-start;min-width:0}
.th{border:2px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);padding:2px 2px 0}
.th canvas{display:block;margin:0 auto;background:var(--chk);image-rendering:pixelated}
.th.sel{border-color:#4a3b3a;box-shadow:inset 0 -3px 0 #f4d35e;color:var(--accent)}
.prev{border-left:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#f1efeb;min-width:120px}
.prev canvas{background:var(--chk);image-rendering:pixelated;border:1px solid #bbb}
.msg{padding:6px 8px;border-radius:4px;margin:4px 0;font-size:12px}
.msg.err{background:#fbe3df;border:1px solid #c0392b;color:#7b1f14}
.msg.warn{background:#fff3d1;border:1px solid #c9a227;color:#6b5400}
.msg.ok{background:#e3f1e3;border:1px solid #3d6b3d;color:#244224}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.kv{width:100%;border-collapse:collapse}.kv td{padding:1px 3px;font-size:12px}
textarea.code{width:100%;height:260px;font:11px/1.35 ui-monospace,monospace;border:1px solid #4a3b3a;padding:6px;background:#fff;color:#333;resize:vertical;white-space:pre}
.bmc-btn{min-width:200px;color:#fefefd!important;background:#5d4c4b!important;height:48px;border-radius:12px;font-size:24px;font-weight:normal;border:none;padding:0 20px;line-height:24px;text-decoration:none!important;display:inline-flex!important;align-items:center;font-family:"Cookie",cursive!important}
.bmc-btn-text{margin-left:8px;white-space:nowrap;line-height:1}
kbd{font:11px ui-monospace,monospace;border:1px solid #4a3b3a;border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff;color:#333}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#4a3b3a;color:#fff;padding:8px 16px;border-radius:6px;z-index:99;display:none;max-width:80vw}
a.manual{color:#4a3b3a;text-decoration:none;border:1px solid #4a3b3a;border-radius:3px;padding:3px 8px;background:#f4d35e;font-weight:600}
a.manual:hover{background:#e8c443}
.modal{position:fixed;inset:0;background:rgba(40,30,30,.55);z-index:50;display:flex;align-items:center;justify-content:center}
.dlg{background:#fefefd;border:3px solid #4a3b3a;border-radius:8px;padding:18px;width:min(640px,94vw);max-height:86vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.dlg h3{margin:0 0 10px;color:var(--accent);font-size:16px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlg table.list{width:100%;border-collapse:collapse;font-size:12px}
.dlg table.list th{text-align:left;color:var(--muted);font-weight:600;padding:3px 6px;border-bottom:2px solid #4a3b3a;position:sticky;top:-18px;background:#fefefd}
.dlg table.list td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dlg table.list tr.bad td{color:#aaa}
.dlg table.list tr.grp td{background:#ebe8e4;font-weight:600;color:var(--accent)}
.dlg .scroll{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:4px}
.dlg canvas.pv{background:var(--chk);image-rendering:pixelated;border:1px solid #bbb;max-width:100%}
.drop{position:fixed;inset:0;background:rgba(244,211,94,.35);border:6px dashed #4a3b3a;z-index:60;display:none;align-items:center;justify-content:center;font-size:26px;color:#4a3b3a;font-weight:700;pointer-events:none}
.help td:first-child{white-space:nowrap;padding-right:14px}
@media (max-width:1000px){.layout{grid-template-columns:1fr;height:auto}.panel{border:0;border-bottom:1px solid var(--line)}.panel.main{height:70vh}}
</style></head>

</header>
<div class="layout">
  <aside class="panel left">
    <h2>Assets</h2>
    <div id="assetList"></div>
    <div class="btns"><button id="aNew" class="sm">＋ New</button><button id="aDup" class="sm ghost">Duplicate</button><button id="aUp" class="sm ghost" title="Move up">▲</button><button id="aDown" class="sm ghost" title="Move down">▼</button><button id="aDel" class="sm ghost">Delete</button></div>
    <h2>Tools</h2>
    <div class="tool-grid" id="tools"></div>
    <label class="row chk" style="margin-top:6px"><input type="checkbox" id="oFilled"> Filled shapes</label>
    <h2>Colors</h2>
    <div class="swatches" id="swatches">
      <button class="sw b" data-c="0" title="Black pixel"></button>
      <button class="sw w" data-c="1" title="White pixel"></button>
      <button class="sw t" data-c="2" title="Transparent (mask off) – sprites only"></button>
    </div>
    <div class="hint">Click = left button color, right-click = right button color. <kbd>X</kbd> swaps them.</div>
    <h2>View</h2>
    <div class="row"><label>Zoom</label><input type="range" id="zoom" min="2" max="48" value="16"><button class="sm ghost" id="zoomFit">Fit</button></div>
    <label class="row chk"><input type="checkbox" id="oGrid" checked> Pixel grid</label>
    <label class="row chk"><input type="checkbox" id="oPages" checked> 8-pixel rows (Arduboy pages)</label>
    <label class="row chk"><input type="checkbox" id="oOnion"> Onion skin (previous frame)</label>
    <h2>Mirror drawing</h2>
    <label class="row chk"><input type="checkbox" id="oMX"> Horizontal</label>
    <label class="row chk"><input type="checkbox" id="oMY"> Vertical</label>
  </aside>
  <main class="panel main">
    <section class="stage">
      <div class="bar"><b id="stName">–</b><span id="stInfo" class="hint"></span><span style="flex:1"></span><span id="stPos" class="hint"></span></div>
      <div class="stage-scroll" id="stageScroll"><canvas id="cv"></canvas></div>
    </section>
    <section class="frames">
      <div class="bar">
        <b id="frLabel">Frames</b>
        <button id="fAdd" class="sm" title="Add an empty frame after the current one">＋ Frame</button>
        <button id="fDup" class="sm ghost">Duplicate</button>
        <button id="fLeft" class="sm ghost" title="Move frame left ( , )">◀</button><button id="fRight" class="sm ghost" title="Move frame right ( . )">▶</button>
        <button id="fDel" class="sm ghost">Delete</button>
        <span class="sep"></span>
        <button id="fPlay" class="play sm" style="min-width:64px">▶ Play</button>
        <label class="hint">fps <input type="number" id="fps" min="1" max="60" value="6" style="width:52px"></label>
      </div>
      <div class="fr-body"><div class="thumbs" id="thumbs"></div><div class="prev"><canvas id="prev" width="64" height="64"></canvas><span class="hint" id="prevInfo"></span></div></div>
    </section>
  </main>
  <aside class="panel right">
    <h2>Properties</h2>
    <div class="row"><label>Name</label><input type="text" id="pName" style="flex:1"></div>
    <div class="row"><label>Type</label><select id="pKind" class="light" style="flex:1"><option value="sprite">Sprite (frames + mask)</option><option value="tile">Tile (square frames)</option><option value="image">Image (single, black/white)</option></select></div>
    <div class="row"><label>Size</label><input type="number" id="pW" min="1" max="256"> × <input type="number" id="pH" min="1" max="256"><button class="sm" id="pApply">Apply</button></div>
    <div class="hint" id="pInfo"></div>
    <h2>Transform</h2>
    <label class="row chk"><input type="checkbox" id="tAll" checked> Apply to all frames</label>
    <div class="btns">
      <button class="sm ghost" id="tFlipH">Flip ⇆</button><button class="sm ghost" id="tFlipV">Flip ⇅</button>
      <button class="sm ghost" id="tRotCW">Rotate ↻</button><button class="sm ghost" id="tRotCCW">Rotate ↺</button>
      <button class="sm ghost" id="tInv">Invert</button><button class="sm ghost" id="tClear">Clear</button>
    </div>
    <div class="btns"><span class="hint" style="align-self:center">Shift (wraps):</span>
      <button class="sm ghost" id="tL">←</button><button class="sm ghost" id="tU">↑</button><button class="sm ghost" id="tD">↓</button><button class="sm ghost" id="tR">→</button>
    </div>
    <h2>Code</h2>
    <div id="oBox" class="row" style="gap:10px">
      <label class="chk"><input type="checkbox" id="oSprite" checked> sprite</label>
      <label class="chk"><input type="checkbox" id="oMask"> mask</label>
      <label class="chk"><input type="checkbox" id="oPlus" checked> sprite + mask</label>
    </div>
    <textarea class="code" id="code" readonly spellcheck="false"></textarea>
    <div class="btns"><button class="sm" id="cCopy">Copy</button><button class="sm ghost" id="cDl">Download .h</button><button class="sm ghost" id="cPng" title="Frames stacked vertically – the sheet format the old converters read">PNG sheet</button><button class="sm ghost" id="cGif" title="Animated GIF of the frames">GIF</button></div>
    <div class="hint" id="cInfo"></div>
  </aside>
</div>

<script>
(()=>{
'use strict';
/* ====================================================================
   ATMlib Sprite Editor – merges the Arduboy image / tile / sprite
   converters with a pixel editor. Pixel values: 0 black, 1 white, 2 transparent
   ==================================================================== */
const BLACK=0, WHITE=1, TR=2, LS='atmSpriteEditor.v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cname=s=>{s=String(s||'').trim().replace(/[^A-Za-z0-9_]/g,'_');if(!s)s='sprite';if(/^\d/.test(s))s='_'+s;return s;};
const hex=n=>'0x'+n.toString(16).padStart(2,'0');
const pad2=n=>String(n).padStart(2,'0');
const pagesOf=h=>Math.ceil(h/8);
let uid=1;
const S={assets:[],cur:0,fr:0};
const V={tool:'pencil',c1:WHITE,c2:BLACK,zoom:16,grid:true,pages:true,onion:false,mx:false,my:false,filled:false,sel:null,clip:null,hover:null,playing:null,playIdx:0};
const A=()=>S.assets[S.cur], F=()=>{const a=A();return a?a.frames[S.fr]:null};
const allowT=a=>a&&a.kind==='sprite';
const bgOf=a=>allowT(a)?TR:BLACK;

function toast(msg,ms=2800){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms);}
function uniq(name,skip){let n=name,i=2;while(S.assets.some(a=>a!==skip&&a.name===n))n=name+'_'+(i++);return n;}
function mkAsset(o){const a={id:uid++,name:o.name,kind:o.kind||'sprite',w:o.w,h:o.h,frames:[]};const fill=a.kind==='sprite'?TR:BLACK;for(let i=0;i<(o.n||1);i++)a.frames.push(new Uint8Array(a.w*a.h).fill(fill));return a;}

/* ---------------- history / persistence ---------------- */
let undoS=[],redoS=[];
const snap=()=>({cur:S.cur,fr:S.fr,assets:S.assets.map(a=>({id:a.id,name:a.name,kind:a.kind,w:a.w,h:a.h,frames:a.frames.map(f=>f.slice())}))});
function restore(s){S.cur=s.cur;S.fr=s.fr;S.assets=s.assets.map(a=>({id:a.id,name:a.name,kind:a.kind,w:a.w,h:a.h,frames:a.frames.map(f=>f.slice())}));V.sel=null;fixIdx();}
function pushUndo(){undoS.push(snap());if(undoS.length>120)undoS.shift();redoS=[];updHist();}
function doUndo(){if(!undoS.length)return;redoS.push(snap());restore(undoS.pop());updHist();refresh();autosave();}
function doRedo(){if(!redoS.length)return;undoS.push(snap());restore(redoS.pop());updHist();refresh();autosave();}
function updHist(){$('#btnUndo').disabled=!undoS.length;$('#btnRedo').disabled=!redoS.length;}
function fixIdx(){S.cur=clamp(S.cur,0,Math.max(0,S.assets.length-1));const a=A();S.fr=a?clamp(S.fr,0,a.frames.length-1):0;}
function serialize(){return {v:1,cur:S.cur,assets:S.assets.map(a=>({name:a.name,kind:a.kind,w:a.w,h:a.h,frames:a.frames.map(f=>Array.from(f).join(''))}))};}
function load(o){
  if(!o||!Array.isArray(o.assets))throw new Error('Not a sprite project');
  const as=o.assets.map(x=>{const a={id:uid++,name:cname(x.name),kind:['sprite','tile','image'].includes(x.kind)?x.kind:'sprite',w:clamp(+x.w|0,1,256),h:clamp(+x.h|0,1,256),frames:[]};
    for(const s of x.frames||[]){const f=new Uint8Array(a.w*a.h);for(let i=0;i<f.length;i++){const v=+s[i];f[i]=v===1?1:v===2?2:0;}a.frames.push(f);}
    if(!a.frames.length)a.frames.push(new Uint8Array(a.w*a.h).fill(a.kind==='sprite'?TR:BLACK));
    return a;});
  S.assets=as;S.cur=clamp(o.cur|0,0,Math.max(0,as.length-1));S.fr=0;V.sel=null;
}

/* ---------------- code generation (same output as the old converters) ---------------- */
function colBytes(a,f,x,p){let s=0,m=0;for(let b=0;b<8;b++){const y=p*8+b;if(y>=a.h)break;const v=f[y*a.w+x];if(v===WHITE)s|=1<<b;if(v!==TR)m|=1<<b;}return [s,m];}
function genArray(a,mode){ // mode: sprite | mask | plus
  const suf=mode==='mask'?'_mask':mode==='plus'?'_plus_mask':'';
  const mark=a.kind==='tile'?'TILE':a.kind==='sprite'?'FRAME':null;
  let s=`const unsigned char PROGMEM ${a.name}${suf}[] =\n{\n// width, height,\n${a.w}, ${a.h},\n`;
  a.frames.forEach((f,i)=>{
    if(mark)s+=`// ${mark} ${pad2(i)}\n`;
    for(let p=0;p<pagesOf(a.h);p++){
      let line='';
      if(mode==='plus'){const half=Math.ceil(a.w/2);for(let x=0;x<a.w;x++){const [sb,mb]=colBytes(a,f,x,p);line+=hex(sb)+', '+hex(mb)+', ';if((x+1)%half===0&&x+1<a.w)line+='\n';}}
      else for(let x=0;x<a.w;x++){const [sb,mb]=colBytes(a,f,x,p);line+=hex(mode==='mask'?mb:sb)+', ';}
      s+=line+'\n';
    }
  });
  return s.replace(/\s*$/,'\n};')+'\n';
}
const hasTransparency=a=>a.frames.some(f=>f.includes(TR));
function partsFor(a,o){ // o: {sprite,mask,plus}
  if(a.kind!=='sprite')return ['sprite'];
  const r=[];if(o.sprite)r.push('sprite');if(o.mask)r.push('mask');if(o.plus)r.push('plus');return r;
}
function genAsset(a,o){return partsFor(a,o).map(m=>genArray(a,m)).join('\n');}
const byteCount=(a,m)=>2+a.frames.length*a.w*pagesOf(a.h)*(m==='plus'?2:1);

/* ---------------- .h parser ---------------- */
function parseH(text){
  let t=text.replace(/\/\/\s*(FRAME|TILE)\s*\d*[^\n]*/gi,(m,k)=>' @'+k[0].toUpperCase()+' ');
  t=t.replace(/\/\*[\s\S]*?\*\//g,' ').replace(/\/\/[^\n]*/g,' ');
  const out=[];
  const al=[];t.replace(/^[ \t]*#\s*define[ \t]+(\w+)[ \t]+([^\n]*)/gm,(m,n,v)=>{if(/\b(char|uint8_t|byte|int8_t)\b/.test(v))al.push(n);return m;});
  const re=new RegExp('((?:\\b(?:static|const|PROGMEM|unsigned|char|uint8_t|byte|int8_t'+al.map(x=>'|'+x).join('')+')\\b\\s*)+)(\\w+)\\s*\\[\\s*[\\w+\\-*\\s]*\\]\\s*(?:PROGMEM\\s*)?=\\s*\\{','g');
  const reOld=/((?:\b(?:static|const|PROGMEM|unsigned|char|uint8_t|byte|int8_t)\b\s*)+)(\w+)\s*\[\s*[\w+\-*\s]*\]\s*(?:PROGMEM\s*)?=\s*\{/g;
  let m;
  while((m=re.exec(t))){
    if(!new RegExp('\\b(char|uint8_t|byte|int8_t'+al.map(x=>'|'+x).join('')+')\\b').test(m[1]))continue;
    let i=re.lastIndex,depth=1,j=i;
    while(j<t.length&&depth>0){const c=t[j++];if(c==='{')depth++;else if(c==='}')depth--;}
    const body=t.slice(i,j-1);re.lastIndex=j;
    const fm=(body.match(/@F/g)||[]).length,tm=(body.match(/@T/g)||[]).length;
    const clean=body.replace(/@[FT]/g,' ');
    const toks=clean.match(/0[xX][0-9a-fA-F]+|0[bB][01]+|\bB[01]{1,8}\b|\b\d+\b/g)||[];
    const rest=clean.replace(/0[xX][0-9a-fA-F]+|0[bB][01]+|\bB[01]{1,8}\b|\b\d+\b/g,'').replace(/[,\s]/g,'');
    const nums=toks.map(x=>/^0[xX]/.test(x)?parseInt(x,16):/^0[bB]/.test(x)?parseInt(x.slice(2),2):/^B[01]/.test(x)?parseInt(x.slice(1),2):parseInt(x,10));
    out.push({name:m[2],nums,fm,tm,junk:rest.length>0});
  }
  return out.map(e=>describe(e));
}
function describe(e){
  const role=/_plus_?mask$/i.test(e.name)?'plus':/_mask$/i.test(e.name)?'mask':'sprite';
  const base=e.name.replace(/_plus_?mask$/i,'').replace(/_mask$/i,'');
  const o={name:e.name,base,role,w:e.nums[0],h:e.nums[1],data:e.nums.slice(2),fm:e.fm,tm:e.tm,ok:false,frames:0,why:''};
  if(e.junk){o.why='not plain byte data';return o;}
  if(e.nums.length<3||!(o.w>=1&&o.w<=256&&o.h>=1&&o.h<=256)){o.why='no width/height header';return o;}
  const per=o.w*pagesOf(o.h)*(role==='plus'?2:1);
  if(o.data.length%per!==0||o.data.length===0){o.why='byte count does not match the size';return o;}
  o.frames=o.data.length/per;o.ok=true;
  o.kind=o.tm>0?'tile':o.fm>0?'sprite':(o.frames===1&&(o.w>=64||o.h>=48))?'image':'sprite';
  return o;
}
function decodeInto(o,which){ // returns array of {bit arrays} -> Uint8Array(w*h) per frame with 1 where bit set
  const pg=pagesOf(o.h),res=[];
  for(let k=0;k<o.frames;k++){const f=new Uint8Array(o.w*o.h);
    for(let p=0;p<pg;p++)for(let x=0;x<o.w;x++){
      let b;if(o.role==='plus')b=o.data[((k*pg+p)*o.w+x)*2+(which==='mask'?1:0)];else b=o.data[(k*pg+p)*o.w+x];
      for(let bit=0;bit<8;bit++){const y=p*8+bit;if(y<o.h&&(b>>bit)&1)f[y*o.w+x]=1;}}
    res.push(f);}
  return res;
}
function buildAssets(sel,kinds){
  const groups=new Map();
  for(const o of sel){if(!groups.has(o.base))groups.set(o.base,{});const g=groups.get(o.base);g[o.role]=o;}
  const made=[];
  for(const [base,g] of groups){
    const same=(x,y)=>x&&y&&x.w===y.w&&x.h===y.h&&x.frames===y.frames;
    const main=g.sprite||g.plus;
    if(!main&&g.mask){ // mask only
      const a={id:uid++,name:uniq(base+'_mask'),kind:'sprite',w:g.mask.w,h:g.mask.h,frames:[]};
      decodeInto(g.mask,'sprite').forEach(f=>{const q=new Uint8Array(f.length);for(let i=0;i<f.length;i++)q[i]=f[i]?WHITE:TR;a.frames.push(q);});
      made.push(a);continue;}
    const kind=g.sprite?(kinds.get(g.sprite.name)||g.sprite.kind):'sprite';
    const a={id:uid++,name:uniq(base),kind,w:main.w,h:main.h,frames:[]};
    const px=decodeInto(main,'sprite');
    let mk=null;
    if(kind==='sprite'){if(same(g.sprite,g.mask))mk=decodeInto(g.mask,'sprite');else if(g.plus&&same(main,g.plus))mk=decodeInto(g.plus,'mask');}
    px.forEach((f,k)=>{const q=new Uint8Array(f.length);for(let i=0;i<f.length;i++){q[i]=f[i]?WHITE:BLACK;if(mk&&!mk[k][i])q[i]=TR;}a.frames.push(q);});
    made.push(a);
  }
  return made;
}

/* ---------------- image -> frames (the converter logic) ---------------- */
function imageToAsset(img,o){
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
  const d=cx.getImageData(0,0,c.width,c.height).data,W=c.width,H=c.height;
  const fw=o.fw,fh=o.fh,n=Math.max(1,Math.floor(H/fh));
  const a={id:uid++,name:o.name,kind:o.kind,w:fw,h:fh,frames:[]};
  const t=o.kind==='sprite'&&o.alpha;
  for(let k=0;k<n;k++){const f=new Uint8Array(fw*fh);
    for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
      const sx=x,sy=k*fh+y;let v;
      if(sx>=W||sy>=H){v=t?TR:BLACK;}
      else{const i=(sy*W+sx)*4,r=d[i],g=d[i+1],b=d[i+2],al=d[i+3];
        if(t&&al===0)v=TR;
        else{const lum=0.299*r+0.587*g+0.114*b;let white=al===0?false:lum>=o.th;if(o.inv)white=!white;v=white?WHITE:BLACK;}}
      f[y*fw+x]=v;}
    a.frames.push(f);}
  return a;
}

/* ---------------- drawing primitives ---------------- */
function put(a,f,x,y,c){if(x<0||y<0||x>=a.w||y>=a.h)return;if(c===TR&&!allowT(a))c=BLACK;f[y*a.w+x]=c;}
function plotM(a,f,x,y,c){put(a,f,x,y,c);if(V.mx)put(a,f,a.w-1-x,y,c);if(V.my)put(a,f,x,a.h-1-y,c);if(V.mx&&V.my)put(a,f,a.w-1-x,a.h-1-y,c);}
function line(x0,y0,x1,y1,pl){let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy;for(;;){pl(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function rect(x0,y0,x1,y1,pl,fill){const xa=Math.min(x0,x1),xb=Math.max(x0,x1),ya=Math.min(y0,y1),yb=Math.max(y0,y1);
  for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++)if(fill||x===xa||x===xb||y===ya||y===yb)pl(x,y);}
function ellipse(x0,y0,x1,y1,pl,fill){

    if(fill){hl(x0,x1,y0);hl(x0,x1,y1);}else{pl(x1,y0);pl(x0,y0);pl(x0,y1);pl(x1,y1);}

}
function flood(a,f,x,y,c){if(x<0||y<0||x>=a.w||y>=a.h)return;if(c===TR&&!allowT(a))c=BLACK;const t=f[y*a.w+x];if(t===c)return;const st=[[x,y]];

function copySel(){const a=A(),r=selRect();if(!r)return false;const f=F(),b=new Uint8Array(r.w*r.h);for(let j=0;j<r.h;j++)for(let i=0;i<r.w;i++)b[j*r.w+i]=f[(r.y0+j)*a.w+r.x0+i];V.clip={w:r.w,h:r.h,b};toast('Copied '+r.w+'×'+r.h+' pixels');return true;}
function clearSel(){const a=A(),r=selRect();if(!r)return;pushUndo();const f=F();for(let j=0;j<r.h;j++)for(let i=0;i<r.w;i++)f[(r.y0+j)*a.w+r.x0+i]=bgOf(a);changed();renderAll();}

  for(let j=0;j<c.h;j++)for(let i=0;i<c.w;i++){const x=ox+i,y=oy+j;if(x<a.w&&y<a.h){let v=c.b[j*c.w+i];if(v===TR&&!allowT(a))v=BLACK;f[y*a.w+x]=v;}}
  V.sel={x0:ox,y0:oy,x1:Math.min(a.w-1,ox+c.w-1),y1:Math.min(a.h-1,oy+c.h-1)};V.tool='select';changed();renderAll();}

function applyT(fn,forceAll){const a=A();if(!a)return;pushUndo();const idx=forceAll||$('#tAll').checked?a.frames.map((_,i)=>i):[S.fr];for(const i of idx)a.frames[i]=fn(a.frames[i],a.w,a.h);changed();refresh();}
const fH=(f,w,h)=>{const g=new Uint8Array(f.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++)g[y*w+x]=f[y*w+(w-1-x)];return g;};
const fV=(f,w,h)=>{const g=new Uint8Array(f.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++)g[y*w+x]=f[(h-1-y)*w+x];return g;};
const shift=(dx,dy)=>(f,w,h)=>{const g=new Uint8Array(f.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++)g[((y+dy+h)%h)*w+((x+dx+w)%w)]=f[y*w+x];return g;};

$('#tL').onclick=()=>applyT(shift(-1,0));$('#tR').onclick=()=>applyT(shift(1,0));$('#tU').onclick=()=>applyT(shift(0,-1));$('#tD').onclick=()=>applyT(shift(0,1));

function rotate(cw){const a=A();if(!a)return;pushUndo();const nw=a.h,nh=a.w;a.frames=a.frames.map(f=>{const g=new Uint8Array(f.length);
  for(let y=0;y<a.h;y++)for(let x=0;x<a.w;x++){const nx=cw?a.h-1-y:y,ny=cw?x:a.w-1-x;g[ny*nw+nx]=f[y*a.w+x];}return g;});a.w=nw;a.h=nh;V.sel=null;changed();refresh();fitZoom();}

   <div class="btns"><button class="sm ghost" id="iAll">Select all</button><button class="sm ghost" id="iNone">Select none</button></div>

  const mode=()=>$('input[name=gm]:checked',el).value;
  function opts(m){const md=mode();let fw,fh,kind;
    if(md==='single'){fw=W;fh=H;kind='image';}else if(md==='tile'){fw=fh=clamp(+$('#gW',el).value|0,1,256);kind='tile';}else{fw=clamp(+$('#gW',el).value|0,1,256);fh=clamp(+$('#gH',el).value|0,1,256);kind='sprite';}
    if(fw>256||fh>256||fw<1||fh<1){toast('Frame size must be 1–256');return null;}
    return {name:'',kind,fw,fh,th:+$('#gTh',el).value,alpha:$('#gAlpha',el).checked,inv:$('#gInv',el).checked};}
  function upd(){const md=mode();$('#gThv',el).textContent=$('#gTh',el).value;
    const sz=$('#gSize',el);sz.style.display=md==='single'?'none':'flex';$('#gH',el).style.display=md==='tile'?'none':'';
    if(md==='tile'){$('#gH',el).value=$('#gW',el).value;}
    const o=opts();if(!o)return;
    const n=Math.max(1,Math.floor(H/o.fh));$('#gCnt',el).textContent=md==='single'?'':`→ ${n} ${md==='tile'?'tile':'frame'}${n>1?'s':''}`;
    let hint='';if(md==='single'&&(W>128||H>64))hint='This is larger than the 128×64 Arduboy screen.';
    if(md==='tile'&&H%o.fh)hint='Height is not a multiple of the tile size – the rest is ignored.';
    if(md==='sprite'&&H%o.fh)hint='Height is not a multiple of the frame height – the rest is ignored.';
    if(md==='sprite'&&W<o.fw)hint='Frame width is larger than the image.';
    $('#gHint',el).textContent=hint;
    const a=imageToAsset(img,o);const pv=$('#gPv',el);const s=Math.max(1,Math.min(6,Math.floor(560/(a.w*Math.min(a.frames.length,8)+8*Math.min(a.frames.length,8)))));
    const cols=Math.min(a.frames.length,12),rows=Math.ceil(a.frames.length/cols);pv.width=cols*(a.w*s+6);pv.height=rows*(a.h*s+6);
    const x=pv.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,pv.width,pv.height);
    a.frames.forEach((f,i)=>{x.drawImage(bitmap(a,f),(i%cols)*(a.w*s+6),Math.floor(i/cols)*(a.h*s+6),a.w*s,a.h*s);});}
  $$('input',el).forEach(i=>i.addEventListener('input',upd));upd();
}

/* ---- export .h ---- */
function exportDialog(){
  if(!S.assets.length)return toast('Nothing to export');
  const rows=S.assets.map((a,i)=>{
    const t=hasTransparency(a);
    const cell=(m,lab,chk,show=true)=>show?`<label class="chk"><input type="checkbox" class="ex" data-i="${i}" data-m="${m}" ${chk?'checked':''}> ${lab}<span class="hint">&nbsp;${byteCount(a,m)} B</span></label>`:'';
    return `<tr><td><b>${esc(a.name)}</b><br><span class="hint">${a.w}×${a.h} · ${a.frames.length} ${a.kind==='tile'?'tile':'frame'}${a.frames.length>1?'s':''} · ${a.kind}</span></td>
      <td>${a.kind==='sprite'?cell('sprite','sprite',true)+'<br>'+cell('mask','mask',t)+'<br>'+cell('plus','sprite + mask',t):cell('sprite',a.kind==='tile'?'tile set':'image',true)}</td></tr>`;});
  const d=dlg('Export .h',`<p class="hint">Choose which assets and which arrays go into the file. “mask” is the separate mask array, “sprite + mask” interleaves both (for <code>drawPlusMask</code>).</p>
    <div class="btns"><button class="sm ghost" id="xAll">Select all</button><button class="sm ghost" id="xNone">Select none</button></div>
    <div class="scroll"><table class="list"><tr><th>Asset</th><th>Arrays</th></tr>${rows.join('')}</table></div>
    <div class="row" style="margin-top:8px"><label>File name</label><input type="text" id="xFile" value="${esc((S.assets.length===1?S.assets[0].name:'bitmaps'))}.h" style="flex:1"></div>
    <label class="row chk"><input type="checkbox" id="xGuard"> Add an include guard (#ifndef … #define … #endif)</label>
    <textarea class="code" id="xPrev" readonly style="height:200px"></textarea><div class="hint" id="xInfo"></div>`,
   [{label:'Cancel',cls:'ghost'},{label:'Copy',cls:'ghost',fn:m=>{const t=build(m);if(!t)return false;navigator.clipboard.writeText(t).then(()=>toast('Copied to the clipboard'),()=>toast('Copy failed'));return false;}},
    {label:'Download .h',cls:'play',fn:m=>{const t=build(m);if(!t){toast('Nothing selected');return false;}let n=$('#xFile',m).value.trim()||'bitmaps.h';if(!/\.[a-z]+$/i.test(n))n+='.h';download(n,new Blob([t],{type:'text/plain'}));}}],{wide:true});
  const el=d.el;
  function build(m){const parts=[];let n=0,bytes=0;S.assets.forEach((a,i)=>{const o={sprite:false,mask:false,plus:false};$$(`.ex[data-i="${i}"]`,el).forEach(c=>{if(c.checked){o[c.dataset.m]=true;n++;bytes+=byteCount(a,c.dataset.m);}});if(a.kind!=='sprite'){o.sprite=$(`.ex[data-i="${i}"]`,el).checked;}const t=genAsset(a,o);if((a.kind==='sprite'&&(o.sprite||o.mask||o.plus))||(a.kind!=='sprite'&&o.sprite))parts.push(t);});
    if(!parts.length){$('#xPrev',el).value='';$('#xInfo',el).textContent='';return '';}
    let t=parts.join('\n');
    if($('#xGuard',el).checked){const g=($('#xFile',el).value.replace(/\.[^.]*$/,'').replace(/[^A-Za-z0-9]/g,'_')+'_H').toUpperCase();t=`#ifndef ${g}\n#define ${g}\n\n${t}\n#endif\n`;}
    $('#xPrev',el).value=t;$('#xInfo',el).textContent=`${n} array${n>1?'s':''} · ${bytes} bytes of data`;return t;}
  $$('input',el).forEach(i=>i.addEventListener('input',()=>build(el)));
  $('#xAll',el).onclick=()=>{$$('.ex',el).forEach(c=>c.checked=true);build(el);};$('#xNone',el).onclick=()=>{$$('.ex',el).forEach(c=>c.checked=false);build(el);};
  build(el);
}
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
$('#btnExport').onclick=exportDialog;

/* ---------------- png / gif export of the current asset ---------------- */
$('#cCopy').onclick=()=>{const t=$('#code').value;if(!t)return;navigator.clipboard.writeText(t).then(()=>toast('Copied to the clipboard'),()=>{$('#code').select();document.execCommand('copy');toast('Copied');});};
$('#cDl').onclick=()=>{const a=A();if(!a)return;download(a.name+'.h',new Blob([$('#code').value],{type:'text/plain'}));};
$('#cPng').onclick=()=>{const a=A();if(!a)return;const c=document.createElement('canvas');c.width=a.w;c.height=a.h*a.frames.length;const x=c.getContext('2d');
  a.frames.forEach((f,i)=>x.drawImage(bitmap(a,f),0,i*a.h));c.toBlob(b=>download(`${a.name}_${a.w}x${a.h}.png`,b),'image/png');};
function lzw(px,minCode){
  const clear=1<<minCode,eoi=clear+1,out=[];let size=minCode+1,next=eoi+1,cur=0,bits=0,dict=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8;}};
  emit(clear);let p=px[0];
  for(let i=1;i<px.length;i++){const k=px[i],key=p*256+k,v=dict.get(key);
    if(v!==undefined){p=v;continue;}
    emit(p);
    if(next<4096){dict.set(key,next++);if(next-1>=(1<<size)&&size<12)size++;}
    else{emit(clear);dict=new Map();next=eoi+1;size=minCode+1;}
    p=k;}
  emit(p);emit(eoi);if(bits>0)out.push(cur&255);return out;
}
function makeGif(a,scale,fps){
  const W=a.w*scale,H=a.h*scale,b=[];const w16=n=>b.push(n&255,(n>>8)&255);
  [...'GIF89a'].forEach(c=>b.push(c.charCodeAt(0)));w16(W);w16(H);b.push(0x91,0,0);
  b.push(0,0,0, 255,255,255, 255,0,255, 0,0,0);
  b.push(0x21,0xFF,0x0B);[...'NETSCAPE2.0'].forEach(c=>b.push(c.charCodeAt(0)));b.push(3,1,0,0,0);
  const delay=Math.max(2,Math.round(100/fps));
  for(const f of a.frames){
    b.push(0x21,0xF9,4,0x09);w16(delay);b.push(2,0);
    b.push(0x2C);w16(0);w16(0);w16(W);w16(H);b.push(0);
    const px=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)px[y*W+x]=f[Math.floor(y/scale)*a.w+Math.floor(x/scale)];
    b.push(2);const data=lzw(px,2);for(let i=0;i<data.length;i+=255){const ch=data.slice(i,i+255);b.push(ch.length,...ch);}b.push(0);
  }
  b.push(0x3B);return new Uint8Array(b);
}
$('#cGif').onclick=()=>{const a=A();if(!a)return;const sc=Math.max(1,Math.min(8,Math.floor(256/Math.max(a.w,a.h))||1));download(a.name+'.gif',new Blob([makeGif(a,sc,clamp(+$('#fps').value||6,1,60))],{type:'image/gif'}));};

/* ---------------- files: open / save / import / drop ---------------- */
$('#btnSave').onclick=()=>{if(!S.assets.length)return toast('Nothing to save');download('sprites.atmsprite',new Blob([JSON.stringify(serialize())],{type:'application/json'}));};
$('#btnOpen').onclick=()=>$('#fileOpen').click();$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileOpen').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openProject(f);};
$('#fileImport').onchange=e=>{[...e.target.files].forEach(handleFile);e.target.value='';};
function openProject(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);pushUndo();load(o);refresh();autosave();fitZoom();toast('Opened '+f.name);}catch(err){toast('Could not open: '+err.message);}};r.readAsText(f);}
function handleFile(f){
  if(/\.(atmsprite|json)$/i.test(f.name))return openProject(f);
  if(/^image\//.test(f.type)||/\.(png|jpe?g|gif|bmp|webp)$/i.test(f.name))return importImageDialog(f);
  const r=new FileReader();r.onload=()=>importHDialog(String(r.result),f.name);r.readAsText(f);
}
let dragN=0;const dh=$('#dropHint');
window.addEventListener('dragenter',e=>{e.preventDefault();dragN++;dh.style.display='flex';});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)dh.style.display='none';});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragN=0;dh.style.display='none';[...(e.dataTransfer.files||[])].forEach(handleFile);});

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown',e=>{
  if($('.modal'))return;const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&(k==='z'||k==='Z')){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
  if(ctrl&&(k==='y'||k==='Y')){e.preventDefault();doRedo();return;}
  if(ctrl&&(k==='c'||k==='C')){if(copySel())e.preventDefault();return;}
  if(ctrl&&(k==='x'||k==='X')){if(copySel()){e.preventDefault();clearSel();}return;}
  if(ctrl&&(k==='v'||k==='V')){if(V.clip){e.preventDefault();pasteClip();}return;}
  if(ctrl)return;
  const map={b:'pencil',e:'eraser',l:'line',r:'rect',o:'ellipse',g:'fill',i:'pick',m:'select'};
  if(map[k.toLowerCase()]){V.tool=map[k.toLowerCase()];renderTools();return;}
  if(k==='x'||k==='X'){[V.c1,V.c2]=[V.c2,V.c1];renderTools();return;}
  if(k==='Delete'||k==='Backspace'){if(V.sel){e.preventDefault();clearSel();}return;}
  if(k==='Escape'){V.sel=null;renderCanvas();return;}
  if(k===' '){e.preventDefault();V.playing?stopPlay():startPlay();return;}
  if(k===','){moveFrame(-1);return;}if(k==='.'){moveFrame(1);return;}
  if(k==='['||k===']'){const a=A();if(!a)return;S.fr=clamp(S.fr+(k===']'?1:-1),0,a.frames.length-1);V.sel=null;refresh();}
});
$('#btnUndo').onclick=doUndo;$('#btnRedo').onclick=doRedo;
window.addEventListener('resize',()=>{});

/* ---------------- start ---------------- */
try{const s=localStorage.getItem(LS);if(s)load(JSON.parse(s));else defaultProject();}catch(e){defaultProject();}
if(!S.assets.length)defaultProject();
refresh();fitZoom();
window.__SE={S,V,parseH,genArray,genAsset,buildAssets,imageToAsset,makeGif,lzw,mkAsset,load,serialize,refresh};
})();
